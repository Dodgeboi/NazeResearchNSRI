name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # One harness runs every check below and reports the full set of
      # failures rather than stopping at the first. It lives in the repository
      # so that what CI verifies and what a reader can verify locally cannot
      # drift apart -- which they had, before this was consolidated.
      #
      # In order: restore the gzipped raw banks (this step now compares
      # SHA-256 rather than modification times, and fails rather than
      # overwriting when an archive disagrees with the file beside it);
      # tests; behavioral validation; archived-source hashes and re-derived
      # counts; frozen-protocol digests; run manifests against the files on
      # disk; the manuscript claim audit; a re-derivation of the headline
      # numbers straight from the raw trials; and an assertion that external
      # validation is still reporting its failures.
      - name: Full verification harness
        run: |
          python scripts/unpack_raw.py
          python scripts/run_full_audit.py
