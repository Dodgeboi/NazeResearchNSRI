# CONFIRMATORY MODE - prespecified paired follow-up to the exploratory
# 28,225-trial standard study. Each scenario is reused across portfolios.
mode: confirmatory
seed: 20260718

experiment:
  facilities: [small_clinic, regional_hospital, large_hospital]
  profiles: [resource_constrained, intermediate_capacity, high_capacity]
  portfolios:
    - baseline_flat
    - basic_segmentation
    - least_privilege
    - patch_90
    - fast_detection
    - isolated_backups
    - identity_controls
    - seg_detect_backup
    - full_defense
  entry_points:
    - workstation
    - internet_facing
    - privileged_system
    - medical_device
    - vendor_connection
  trials_per_cell: 30
  workers: 0

sweep:
  enabled: true
  facility: regional_hospital
  profile: intermediate_capacity
  patch_levels: [0.25, 0.50, 0.75, 0.90]
  detection_delays: [1, 3, 6, 12, 24]
  trials_per_cell: 150

optimization:
  enabled: false
  facility: regional_hospital
  profiles: [resource_constrained, intermediate_capacity, high_capacity]
  budgets: [5, 10, 15]
  trials_per_portfolio: 25
  cost_scale_factors: [0.5, 0.75, 1.0, 1.25, 1.5]
  catastrophic_target: 0.05
