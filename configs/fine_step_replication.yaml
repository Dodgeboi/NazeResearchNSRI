# Post-diagnostic 5-minute replication. Frozen before generating
# data/fine_step_replication. Mechanistic values are clock-time conversions of
# the 15-minute stress reference, not empirical estimates.
mode: fine_step_replication
seed: 5701001

facilities:
  scale_2:
    min_nodes: 200
    max_nodes: 300

profiles:
  intermediate_posture:
    patch_coverage: 0.50
    detection_delay_steps: 36
    isolation_success: 0.3305670499
    legacy_fraction: 0.15
    base_segmentation: basic
    backup_strategy: periodic
    budget: 10
    complexity_factor: 1.1

simulation:
  max_steps: 864
  step_minutes: 5
  base_spread_rate: 0.1337609218
  patch_effectiveness: 0.85
  detection_model: geometric
  false_positive_rate: 0.0006671116
  false_positive_duration: 24
  rapid_isolation_success: 0.6315968501
  detection_improvement_factor: 0.5
  identity_breach_multiplier: 1.5
  restore_rate_fraction: 0.0066666667
  restore_rate_min: 0.3333333333
  restore_duration: 6
  no_backup_restore_penalty: 0.25
  service_functional_fraction: 0.60
  catastrophic_service_steps: 24
  early_stop: true

experiment:
  facilities: [scale_2]
  profiles: [intermediate_posture]
  portfolios: [baseline_flat, seg_detect_backup]
  entry_points: [workstation, internet_facing, privileged_system, medical_device, vendor_connection]
  trials_per_cell: 500
  workers: 0

sweep:
  enabled: false
  facility: scale_2
  profile: intermediate_posture
  patch_levels: [0.25, 0.50]
  detection_delays: [18, 36]
  trials_per_cell: 10

optimization:
  enabled: false
  facility: scale_2
  profiles: [intermediate_posture]
  budgets: [10]
  trials_per_portfolio: 10
  cost_scale_factors: [1.0]
  catastrophic_target: 0.05

output:
  raw_dir: data/fine_step_replication/raw
  processed_dir: data/fine_step_replication/processed
  figures_dir: outputs/fine_step_replication/figures
  tables_dir: outputs/fine_step_replication/tables
  logs_dir: outputs/fine_step_replication/logs
